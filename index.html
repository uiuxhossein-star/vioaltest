<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Viola — effortless elegance in full bloom. Timeless tailoring, soft silhouettes and accessories." />
    <title>Viola — Effortless Elegance in Full Bloom</title>
    <link rel="preload" as="image" href="./img/hero.webp" fetchpriority="high" />
    <script>
      // Motion is opt-in: content is fully visible unless JS runs. A safety timer
      // reveals everything if the app fails to mount.
      document.documentElement.classList.add('js-motion');
      setTimeout(function () {
        if (!document.documentElement.classList.contains('app-ready')) {
          document.documentElement.classList.remove('js-motion');
        }
      }, 2500);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
